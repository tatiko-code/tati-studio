<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Connecting to TikTok — Tati Studio</title>
  <style>
    body { font-family: 'Georgia', serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #fff; }
    .msg { text-align: center; color: #333; max-width: 500px; }
    h1 { font-weight: 300; font-size: 1.5rem; margin-bottom: 0.5em; }
    p { font-size: 0.9rem; color: #888; }
    #code-box { font-family: monospace; font-size: 0.8rem; background: #f5f5f5; padding: 12px; border-radius: 4px; word-break: break-all; margin: 1em 0; text-align: left; }
    #copy-btn { background: #000; color: #fff; border: none; padding: 8px 20px; cursor: pointer; font-family: inherit; font-size: 0.85rem; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="msg">
    <h1>TikTok Authorization Complete</h1>
    <div id="code-section" style="display:none">
      <p>Copy this code and paste it into the terminal:</p>
      <div id="code-box"></div>
      <button id="copy-btn" onclick="copyCode()">Copy Code</button>
    </div>
    <p id="default-msg">You can close this window and return to the app.</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) {
      document.getElementById('code-box').textContent = code;
      document.getElementById('code-section').style.display = 'block';
      document.getElementById('default-msg').style.display = 'none';
    }
    function copyCode() {
      navigator.clipboard.writeText(document.getElementById('code-box').textContent);
      document.getElementById('copy-btn').textContent = 'Copied!';
    }
  </script>
</body>
</html>
